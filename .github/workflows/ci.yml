name: CI - Pull Request Checks

# Run on every pull request to main, develop, or feature branches
on:
  pull_request:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  push:
    branches:
      - develop
      - 'feature/**'

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Run flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Check for outdated dependencies
        run: flutter pub outdated --no-dependency-overrides

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create .env file for tests
        run: |
          cat > .env <<EOF
          ACCOUNT_SID=TEST_ACCOUNT_SID
          AUTH_TOKEN=TEST_AUTH_TOKEN
          TWILIO_NUMBER=+15555555555
          GENKIT_BACKEND_URL=https://us-central1-juan-heart-project.cloudfunctions.net/assessHeartRiskHttp
          FEATURE_FLAGS_URL=
          EDUCATIONAL_CONTENT_API_URL=http://localhost:8000/api/v1/mobile
          GOOGLE_GEOCODING_API_KEY=TEST_API_KEY
          EOF

      - name: Run unit tests
        run: flutter test --coverage --exclude-tags=integration

      - name: Run integration tests
        run: flutter test --tags=integration --no-coverage || true
        # Integration tests may fail without backend, so we allow failure

      - name: Generate coverage report
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage \
            --lcov \
            --in=coverage \
            --out=coverage/lcov.info \
            --packages=.packages \
            --report-on=lib

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: juan-heart-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Coverage summary
        run: |
          if [ -f coverage/lcov.info ]; then
            echo "📊 Coverage Report Generated"
            echo "View full report: https://codecov.io/gh/${{ github.repository }}"
          fi

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create .env file
        run: |
          cat > .env <<EOF
          ACCOUNT_SID=CI_ACCOUNT_SID
          AUTH_TOKEN=CI_AUTH_TOKEN
          TWILIO_NUMBER=+15555555555
          GENKIT_BACKEND_URL=https://us-central1-juan-heart-project.cloudfunctions.net/assessHeartRiskHttp
          FEATURE_FLAGS_URL=
          EDUCATIONAL_CONTENT_API_URL=http://localhost:8000/api/v1/mobile
          GOOGLE_GEOCODING_API_KEY=CI_API_KEY
          EOF

      - name: Build debug APK
        run: flutter build apk --debug --split-per-abi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run dependency vulnerability scan
        run: |
          # Check for known security vulnerabilities in dependencies
          flutter pub outdated --show-all --json > outdated.json || true

          echo "🔒 Dependency Security Scan Complete"
          echo "Review outdated.json for vulnerable packages"

      - name: Check for hardcoded secrets
        run: |
          echo "🔍 Scanning for hardcoded secrets..."

          # Check for common secret patterns
          if grep -r -E "(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35})" lib/ --exclude-dir=.git; then
            echo "⚠️  Warning: Potential hardcoded secrets found"
            exit 1
          fi

          echo "✅ No hardcoded secrets detected"

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [analyze, test, build-android, security-scan]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "📋 CI Check Results:"
          echo "- Code Analysis: ${{ needs.analyze.result }}"
          echo "- Tests: ${{ needs.test.result }}"
          echo "- Android Build: ${{ needs.build-android.result }}"
          echo "- Security Scan: ${{ needs.security-scan.result }}"

          if [ "${{ needs.analyze.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build-android.result }}" != "success" ] || \
             [ "${{ needs.security-scan.result }}" != "success" ]; then
            echo "❌ Some checks failed"
            exit 1
          fi

          echo "✅ All CI checks passed!"
