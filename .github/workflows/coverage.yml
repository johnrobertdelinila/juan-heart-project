name: Coverage Report

# Run on pull requests and pushes to main branches
on:
  pull_request:
    branches:
      - main
      - master
      - develop
  push:
    branches:
      - main
      - master
      - develop

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for coverage comparison

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true

      - name: Install lcov
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov

      - name: Get dependencies
        run: flutter pub get

      - name: Create .env file for tests
        run: |
          cat > .env <<EOF
          ACCOUNT_SID=TEST_ACCOUNT_SID
          AUTH_TOKEN=TEST_AUTH_TOKEN
          TWILIO_NUMBER=+15555555555
          GENKIT_BACKEND_URL=https://us-central1-juan-heart-project.cloudfunctions.net/assessHeartRiskHttp
          FEATURE_FLAGS_URL=
          EDUCATIONAL_CONTENT_API_URL=http://localhost:8000/api/v1/mobile
          GOOGLE_GEOCODING_API_KEY=TEST_API_KEY
          EOF

      - name: Generate coverage report
        run: |
          chmod +x scripts/generate_coverage.sh
          ./scripts/generate_coverage.sh --html

      - name: Check coverage thresholds
        id: coverage_check
        continue-on-error: true
        run: |
          chmod +x scripts/coverage_check.sh
          ./scripts/coverage_check.sh

      - name: Generate coverage badge
        run: |
          chmod +x scripts/coverage_badge.sh
          ./scripts/coverage_badge.sh

      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE=$(lcov --summary coverage/lcov_filtered.info 2>&1 | grep "lines" | sed 's/.*: \([0-9.]*\)%.*/\1/')
          echo "percentage=${COVERAGE}" >> $GITHUB_OUTPUT
          echo "Coverage: ${COVERAGE}%"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov_filtered.info
          flags: unittests
          name: juan-heart-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage/html/
          retention-days: 30

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary-${{ github.sha }}
          path: |
            coverage/coverage_summary.txt
            coverage/metadata.json
            coverage/coverage_badge.json
          retention-days: 30

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const coverage = '${{ steps.coverage.outputs.percentage }}';
            const checkPassed = '${{ steps.coverage_check.outcome }}' === 'success';

            // Read coverage summary
            let summaryText = '';
            try {
              summaryText = fs.readFileSync('coverage/coverage_summary.txt', 'utf8');
            } catch (error) {
              summaryText = 'Coverage summary not available';
            }

            // Read critical paths coverage
            const metadata = JSON.parse(fs.readFileSync('coverage/metadata.json', 'utf8'));

            // Determine status emoji
            const statusEmoji = checkPassed ? '✅' : '⚠️';
            const coverageColor = parseFloat(coverage) >= 70 ? '🟢' : parseFloat(coverage) >= 60 ? '🟡' : '🔴';

            // Create comment body
            const commentBody = `## ${statusEmoji} Coverage Report

### Overall Coverage: ${coverageColor} ${coverage}%

**Thresholds:**
- Overall: 70% ${parseFloat(coverage) >= 70 ? '✅' : '❌'}
- Critical Paths: 80% ${checkPassed ? '✅' : '⚠️'}
- Services: 75%
- UI Widgets: 60%

### Coverage Details

<details>
<summary>View Coverage Summary (click to expand)</summary>

\`\`\`
${summaryText.split('\n').slice(0, 50).join('\n')}
\`\`\`

</details>

### Quick Links
- [Full HTML Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
- [Codecov Report](https://codecov.io/gh/${{ github.repository }})

---
📊 Report generated at ${new Date().toISOString()}
`;

            // Post or update comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes('Coverage Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }

      - name: Fail if coverage below threshold
        if: steps.coverage_check.outcome == 'failure'
        run: |
          echo "❌ Coverage check failed - thresholds not met"
          echo "Review the coverage report for details"
          exit 1

  coverage-comparison:
    name: Coverage Comparison
    runs-on: ubuntu-latest
    needs: coverage
    if: github.event_name == 'pull_request'
    timeout-minutes: 15

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true

      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Get dependencies
        run: flutter pub get

      - name: Generate PR coverage
        run: |
          cat > .env <<EOF
          ACCOUNT_SID=TEST_ACCOUNT_SID
          AUTH_TOKEN=TEST_AUTH_TOKEN
          TWILIO_NUMBER=+15555555555
          GENKIT_BACKEND_URL=https://us-central1-juan-heart-project.cloudfunctions.net/assessHeartRiskHttp
          FEATURE_FLAGS_URL=
          EDUCATIONAL_CONTENT_API_URL=http://localhost:8000/api/v1/mobile
          GOOGLE_GEOCODING_API_KEY=TEST_API_KEY
          EOF

          flutter test --coverage --exclude-tags=integration

          lcov --remove coverage/lcov.info \
            '*.g.dart' '*.freezed.dart' '*.config.dart' '*/test/*' \
            -o coverage/lcov_pr.info

          PR_COVERAGE=$(lcov --summary coverage/lcov_pr.info 2>&1 | grep "lines" | sed 's/.*: \([0-9.]*\)%.*/\1/')
          echo "PR_COVERAGE=${PR_COVERAGE}" >> $GITHUB_ENV

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Generate base coverage
        run: |
          flutter pub get
          flutter test --coverage --exclude-tags=integration || true

          if [ -f coverage/lcov.info ]; then
            lcov --remove coverage/lcov.info \
              '*.g.dart' '*.freezed.dart' '*.config.dart' '*/test/*' \
              -o coverage/lcov_base.info

            BASE_COVERAGE=$(lcov --summary coverage/lcov_base.info 2>&1 | grep "lines" | sed 's/.*: \([0-9.]*\)%.*/\1/')
            echo "BASE_COVERAGE=${BASE_COVERAGE}" >> $GITHUB_ENV
          else
            echo "BASE_COVERAGE=0" >> $GITHUB_ENV
          fi

      - name: Compare coverage
        run: |
          PR_COV="${PR_COVERAGE:-0}"
          BASE_COV="${BASE_COVERAGE:-0}"

          DIFF=$(echo "$PR_COV - $BASE_COV" | bc)

          echo "Coverage Comparison:"
          echo "Base: ${BASE_COV}%"
          echo "PR: ${PR_COV}%"
          echo "Diff: ${DIFF}%"

          if (( $(echo "$DIFF < -5" | bc -l) )); then
            echo "⚠️  Coverage decreased by more than 5%"
            exit 1
          fi

      - name: Comment coverage comparison
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prCoverage = process.env.PR_COVERAGE || '0';
            const baseCoverage = process.env.BASE_COVERAGE || '0';
            const diff = (parseFloat(prCoverage) - parseFloat(baseCoverage)).toFixed(2);

            const emoji = parseFloat(diff) >= 0 ? '📈' : '📉';
            const color = parseFloat(diff) >= 0 ? '🟢' : parseFloat(diff) > -5 ? '🟡' : '🔴';

            const body = `### ${emoji} Coverage Comparison

| Branch | Coverage |
|--------|----------|
| Base (\`${{ github.event.pull_request.base.ref }}\`) | ${baseCoverage}% |
| PR (\`${{ github.event.pull_request.head.ref }}\`) | ${prCoverage}% |
| **Difference** | ${color} **${diff > 0 ? '+' : ''}${diff}%** |
`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });
